<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Cooling Solution - Buy & Sell</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b63ce;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:5px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 8px #0001;
}

.card h3{
  font-size:14px;
  color:#667085;
}

.card strong{
  display:block;
  font-size:22px;
  margin-top:8px;
}

.form-box{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #d0d5dd;
  border-radius:7px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn{
  background:#0b63ce;
  color:white;
  margin-top:15px;
}

.cancel-btn{
  background:#667085;
  color:white;
  margin-top:15px;
  margin-left:5px;
  display:none;
}

.table-box{
  background:white;
  border-radius:12px;
  padding:15px;
  overflow-x:auto;
  box-shadow:0 2px 8px #0001;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eaecf0;
  text-align:left;
  font-size:14px;
}

th{
  background:#f2f4f7;
}

.profit{
  color:#079455;
  font-weight:bold;
}

.loss{
  color:#d92d20;
  font-weight:bold;
}

.status{
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
}

.stock{
  background:#fff4cc;
}

.sold{
  background:#d1fadf;
}

.action button{
  padding:7px 10px;
  margin:2px;
}

.edit{
  background:#e0f2fe;
}

.delete{
  background:#fee4e2;
  color:#b42318;
}

.search{
  margin-bottom:12px;
}

@media(max-width:800px){
  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:450px){
  .dashboard{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>NG COOLING SOLUTION</h1>
  <p>Buy & Sell Management System</p>
</header>

<div class="container">

<!-- Dashboard -->
<div class="dashboard">

  <div class="card">
    <h3>Total Items</h3>
    <strong id="totalItems">0</strong>
  </div>

  <div class="card">
    <h3>Total Cost</h3>
    <strong id="totalCost">₹0</strong>
  </div>

  <div class="card">
    <h3>Total Sales</h3>
    <strong id="totalSales">₹0</strong>
  </div>

  <div class="card">
    <h3>Total Profit</h3>
    <strong id="totalProfit">₹0</strong>
  </div>

</div>

<!-- Form -->
<div class="form-box">

<h2 id="formTitle">Add New Purchase</h2>

<br>

<div class="form-grid">

  <div>
    <label>Date</label>
    <input type="date" id="date">
  </div>

  <div>
    <label>Product</label>
    <select id="product">
      <option>AC</option>
      <option>Fridge</option>
      <option>Washing Machine</option>
      <option>Microwave</option>
      <option>Geyser</option>
    </select>
  </div>

  <div>
    <label>Buy Price (₹)</label>
    <input type="number" id="buyPrice" placeholder="8000">
  </div>

  <div>
    <label>Transport (₹)</label>
    <input type="number" id="transport" value="0">
  </div>

  <div>
    <label>Repair / Parts (₹)</label>
    <input type="number" id="repair" value="0">
  </div>

  <div>
    <label>Sell Price (₹)</label>
    <input type="number" id="sellPrice" placeholder="12000">
  </div>

  <div>
    <label>Status</label>
    <select id="status">
      <option value="In Stock">In Stock</option>
      <option value="Sold">Sold</option>
    </select>
  </div>

</div>
