<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Cooling Solution - Advanced Digital Dashboard</title>

<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --nayan-color: #0284c7;
  --ashid-color: #7c3aed;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  background: var(--bg);
  color: var(--text);
}

header{
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color:white;
  padding:20px 20px;
  text-align:center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

header h1{
  font-size:28px;
  letter-spacing: 1px;
  color: #38bdf8;
}

header p{
  margin-top:6px;
  color: #94a3b8;
  font-size: 14px;
}

/* Page Navigation Tabs */
.nav-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  background: #0f172a;
  padding-bottom: 15px;
}

.tab-btn {
  background: #334155;
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: var(--primary);
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

.container{
  max-width:1250px;
  margin:auto;
  padding:20px 15px;
}

.page-content {
  display: none;
}

.page-content.active {
  display: block;
}

/* Digital Stats Grid */
.digital-banner {
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
  border-radius: 16px;
  padding: 20px;
  color: white;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.digital-banner h2 {
  font-size: 16px;
  color: #a5b4fc;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.progress-bar-bg {
  background: rgba(255,255,255,0.1);
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 8px;
}

.progress-bar-fill {
  background: linear-gradient(90deg, #38bdf8, #10b981);
  height: 100%;
  width: 0%;
  transition: width 0.5s ease;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: #cbd5e1;
}

/* Dashboard Cards */
.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:15px;
}

.dashboard-partner{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background: var(--card-bg);
  border-radius:14px;
  padding:20px;
  border: 1px solid var(--border);
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);
  transition: transform 0.2s, box-shadow 0.2s;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
}

.card.partner-nayan{
  border-top: 5px solid var(--nayan-color);
  background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
}

.card.partner-ashid{
  border-top: 5px solid var(--ashid-color);
  background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 100%);
}

.card h3{
  font-size:13px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
}

.card strong{
  display:block;
  font-size:24px;
  margin-top:10px;
  color: var(--text);
}

.card .sub-text{
  font-size:13px;
  margin-top:8px;
  font-weight: 600;
}

/* Forms */
.form-box{
  background: var(--card-bg);
  padding:22px;
  border-radius:14px;
  border: 1px solid var(--border);
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);
  margin-bottom:20px;
}

.form-box h2 {
  font-size: 18px;
  color: var(--text);
  border-bottom: 2px solid var(--border);
  padding-bottom: 10px;
  margin-bottom: 15px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
  font-size:13px;
  color: var(--text-muted);
}

input,select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:14px;
  background: #f8fafc;
  outline: none;
  transition: border 0.2s;
}

input:focus, select:focus {
  border-color: var(--primary);
  background: #fff;
}

button{
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  transition: opacity 0.2s;
}

button:hover {
  opacity: 0.9;
}

.add-btn{
  background: var(--primary);
  color:white;
  margin-top:15px;
}

.cancel-btn{
  background: var(--text-muted);
  color:white;
  margin-top:15px;
  margin-left:8px;
  display:none;
}

/* Table */
.table-box{
  background: var(--card-bg);
  border-radius:14px;
  padding:20px;
  overflow-x:auto;
  border: 1px solid var(--border);
  box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);
}

.table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.search{
  width: 300px;
  padding: 10px;
  border-radius: 8px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1100px;
}

th,td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:14px;
}

th{
  background:#f1f5f9;
  color: var(--text-muted);
  font-weight: 600;
}

.profit{
  color: var(--success);
  font-weight:bold;
}

.loss{
  color: var(--danger);
  font-weight:bold;
}

.status{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}

.stock{
  background:#fef3c7;
  color:#b45309;
}

.sold{
  background:#dcfce7;
  color:#15803d;
}

.action button{
  padding:6px 12px;
  margin:2px;
  font-size: 12px;
}

.edit{
  background:#e0f2fe;
  color:#0369a1;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
}

@media(max-width:900px){
  .dashboard, .dashboard-partner, .form-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .dashboard, .dashboard-partner, .form-grid{
    grid-template-columns:1fr;
  }
  .table-header {
    flex-direction: column;
