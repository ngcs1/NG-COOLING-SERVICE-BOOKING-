<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Cooling Solution - Buy & Sell</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b63ce;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:5px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  box-shadow:0 2px 8px #0001;
}

.card h3{
  font-size:14px;
  color:#667085;
}

.card strong{
  display:block;
  font-size:22px;
  margin-top:8px;
}

.form-box{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #d0d5dd;
  border-radius:7px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn{
  background:#0b63ce;
  color:white;
  margin-top:15px;
}

.cancel-btn{
  background:#667085;
  color:white;
  margin-top:15px;
  margin-left:5px;
  display:none;
}

.table-box{
  background:white;
  border-radius:12px;
  padding:15px;
  overflow-x:auto;
  box-shadow:0 2px 8px #0001;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1000px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #eaecf0;
  text-align:left;
  font-size:14px;
}

th{
  background:#f2f4f7;
}

.profit{
  color:#079455;
  font-weight:bold;
}

.loss{
  color:#d92d20;
  font-weight:bold;
}

.status{
  padding:5px 9px;
  border-radius:15px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}

.stock{
  background:#fff4cc;
  color:#8a6d0b;
}

.sold{
  background:#d1fadf;
  color:#027a48;
}

.action button{
  padding:7px 10px;
  margin:2px;
}

.edit{
  background:#e0f2fe;
  color:#026aa7;
}

.delete{
  background:#fee4e2;
  color:#b42318;
}

.search{
  margin-bottom:12px;
}

@media(max-width:800px){
  .dashboard{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:450px){
  .dashboard{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>NG COOLING SOLUTION</h1>
  <p>Buy & Sell Management System</p>
</header>

<div class="container">

<!-- Dashboard -->
<div class="dashboard">

  <div class="card">
    <h3>Total Items</h3>
    <strong id="totalItems">0</strong>
  </div>

  <div class="card">
    <h3>Total Cost</h3>
    <strong id="totalCost">₹0</strong>
  </div>

  <div class="card">
    <h3>Total Sales</h3>
    <strong id="totalSales">₹0</strong>
  </div>

  <div class="card">
    <h3>Total Profit</h3>
    <strong id="totalProfit">₹0</strong>
  </div>

</div>

<!-- Form -->
<div class="form-box">

<h2 id="formTitle">Add New Purchase</h2>

<br>

<div class="form-grid">

  <div>
    <label>Date</label>
    <input type="date" id="date">
  </div>

  <div>
    <label>Product</label>
    <select id="product">
      <option value="AC">AC</option>
      <option value="Fridge">Fridge</option>
      <option value="Washing Machine">Washing Machine</option>
      <option value="Microwave">Microwave</option>
      <option value="Geyser">Geyser</option>
    </select>
  </div>

  <div>
    <label>Buy Price (₹)</label>
    <input type="number" id="buyPrice" placeholder="8000">
  </div>

  <div>
    <label>Transport (₹)</label>
    <input type="number" id="transport" value="0">
  </div>

  <div>
    <label>Repair / Parts (₹)</label>
    <input type="number" id="repair" value="0">
  </div>

  <div>
    <label>Sell Price (₹)</label>
    <input type="number" id="sellPrice" placeholder="12000">
  </div>

  <div>
    <label>Status</label>
    <select id="status">
      <option value="In Stock">In Stock</option>
      <option value="Sold">Sold</option>
    </select>
  </div>

</div>

<button class="add-btn" onclick="saveItem()" id="saveBtn">Save Product</button>
<button class="cancel-btn" onclick="resetForm()" id="cancelBtn">Cancel</button>

</div>

<!-- Table -->
<div class="table-box">

  <input type="text" class="search" id="search" placeholder="Search by product or status..." onkeyup="renderData()">

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Product</th>
        <th>Buy Price</th>
        <th>Transport</th>
        <th>Repair</th>
        <th>Total Cost</th>
        <th>Sell Price</th>
        <th>Profit / Loss</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="inventoryList">
    </tbody>
  </table>

</div>

</div>

<script>
let inventory = JSON.parse(localStorage.getItem('ng_inventory')) || [];
let editIndex = null;

// Set today's date in form by default
document.getElementById('date').valueAsDate = new Date();

function renderData() {
  const tbody = document.getElementById('inventoryList');
  const searchQuery = document.getElementById('search').value.toLowerCase();
  tbody.innerHTML = '';

  let totalCostSum = 0;
  let totalSalesSum = 0;
  let totalProfitSum = 0;

  inventory.forEach((item, index) => {
    const totalCost = Number(item.buyPrice) + Number(item.transport) + Number(item.repair);
    const profit = item.status === 'Sold' ? Number(item.sellPrice) - totalCost : 0;

    // Accumulate metrics
    totalCostSum += totalCost;
    if (item.status === 'Sold') {
      totalSalesSum += Number(item.sellPrice);
      totalProfitSum += profit;
    }

    // Filter for search
    if (item.product.toLowerCase().includes(searchQuery) || item.status.toLowerCase().includes(searchQuery)) {
      const statusClass = item.status === 'In Stock' ? 'stock' : 'sold';
      const profitClass = profit >= 0 ? 'profit' : 'loss';

      tbody.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td><strong>${item.product}</strong></td>
          <td>₹${item.buyPrice}</td>
          <td>₹${item.transport}</td>
          <td>₹${item.repair}</td>
          <td><strong>₹${totalCost}</strong></td>
          <td>₹${item.sellPrice || 0}</td>
          <td class="${profitClass}">₹${item.status === 'Sold' ? profit : 0}</td>
          <td><span class="status ${statusClass}">${item.status}</span></td>
          <td class="action">
            <button class="edit" onclick="editItem(${index})">Edit</button>
            <button class="delete" onclick="deleteItem(${index})">Delete</button>
          </td>
        </tr>
      `;
    }
  });

  // Update Dashboard
  document.getElementById('totalItems').innerText = inventory.length;
  document.getElementById('totalCost').innerText = '₹' + totalCostSum;
  document.getElementById('totalSales').innerText = '₹' + totalSalesSum;
  document.getElementById('totalProfit').innerText = '₹' + totalProfitSum;

  // Save to LocalStorage
  localStorage.setItem('ng_inventory', JSON.stringify(inventory));
}

function saveItem() {
  const date = document.getElementById('date').value;
  const product = document.getElementById('product').value;
  const buyPrice = document.getElementById('buyPrice').value;
  const transport = document.getElementById('transport').value || 0;
  const repair = document.getElementById('repair').value || 0;
  const sellPrice = document.getElementById('sellPrice').value || 0;
  const status = document.getElementById('status').value;

  if (!date || !buyPrice) {
    alert('Please enter Date and Buy Price!');
    return;
  }

  const itemData = { date, product, buyPrice, transport, repair, sellPrice, status };

  if (editIndex === null) {
    inventory.push(itemData);
  } else {
    inventory[editIndex] = itemData;
    editIndex = null;
  }

  resetForm();
  renderData();
}

function editItem(index) {
  const item = inventory[index];
  document.getElementById('date').value = item.date;
  document.getElementById('product').value = item.product;
  document.getElementById('buyPrice').value = item.buyPrice;
  document.getElementById('transport').value = item.transport;
  document.getElementById('repair').value = item.repair;
  document.getElementById('sellPrice').value = item.sellPrice;
  document.getElementById('status').value = item.status;

  editIndex = index;
  document.getElementById('formTitle').innerText = 'Edit Purchase';
  document.getElementById('saveBtn').innerText = 'Update Product';
  document.getElementById('cancelBtn').style.display = 'inline-block';
}

function deleteItem(index) {
  if (confirm('Are you sure you want to delete this entry?')) {
    inventory.splice(index, 1);
    renderData();
  }
}

function resetForm() {
  document.getElementById('date').valueAsDate = new Date();
  document.getElementById('product').selectedIndex = 0;
  document.getElementById('buyPrice').value = '';
  document.getElementById('transport').value = '0';
  document.getElementById('repair').value = '0';
  document.getElementById('sellPrice').value = '';
  document.getElementById('status').value = 'In Stock';

  editIndex = null;
  document.getElementById('formTitle').innerText = 'Add New Purchase';
  document.getElementById('saveBtn').innerText = 'Save Product';
  document.getElementById('cancelBtn').style.display = 'none';
}

// Initial render
renderData();
</script>

</body>
</html>
