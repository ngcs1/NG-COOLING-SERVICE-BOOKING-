<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PDF Edit & Share</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- PDF-LIB -->
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f3f6;
  font-family: Arial, sans-serif;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: white;
  padding: 10px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: center;
  box-shadow: 0 2px 10px #0002;
}

button,
.upload {
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  background: #2563eb;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

button.green {
  background: #16a34a;
}

button.red {
  background: #dc2626;
}

button.gray {
  background: #4b5563;
}

input[type=file] {
  display: none;
}

#pages {
  padding: 20px 10px;
}

.page {
  position: relative;
  width: fit-content;
  margin: 0 auto 25px;
  background: white;
  box-shadow: 0 4px 18px #0002;
}

.pdfCanvas {
  display: block;
  max-width: 100%;
}

.editCanvas {
  position: absolute;
  left: 0;
  top: 0;
  cursor: crosshair;
}

.empty {
  text-align: center;
  padding: 70px 20px;
  color: #6b7280;
}

#status {
  text-align: center;
  padding: 10px;
  font-size: 14px;
}

.passwordBox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #0008;
  align-items: center;
  justify-content: center;
}

.passwordCard {
  background: white;
  width: calc(100% - 40px);
  max-width: 380px;
  padding: 25px;
  border-radius: 15px;
}

.passwordCard h2 {
  margin-top: 0;
}

.passwordCard input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.passwordActions {
  display: flex;
  gap: 8px;
}

@media(max-width:600px) {

  button,
  .upload {
    font-size: 12px;
    padding: 9px 10px;
  }

  #pages {
    padding: 10px 4px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📄 PDF Edit & Share</h1>
</header>

<div class="toolbar">

  <label class="upload">
    📂 Open PDF
    <input
      id="pdfInput"
      type="file"
      accept="application/pdf"
      multiple>
  </label>

  <button onclick="setTool('draw')">
    ✏️ Draw
  </button>

  <button onclick="setTool('highlight')">
    🟡 Highlight
  </button>

  <button class="gray" onclick="clearEdits()">
    🧹 Clear
  </button>

  <button class="red" onclick="deleteLastPage()">
    🗑 Delete Page
  </button>

  <button class="green" onclick="exportPDF()">
    💾 Save PDF
  </button>

  <button onclick="sharePDF()">
    📤 Share
  </button>

</div>

<div id="status">
  No PDF selected
</div>

<div id="pages">
  <div class="empty">
    Upload one or more PDF files to begin.
  </div>
</div>

<!-- PASSWORD DIALOG -->

<div class="passwordBox" id="passwordBox">

  <div class="passwordCard">

    <h2>🔐 PDF Password</h2>

    <p>
      This PDF is password protected.
      Enter the password to continue.
    </p>

    <input
      id="passwordInput"
      type="password"
      placeholder="Enter PDF password">

    <div class="passwordActions">

      <button onclick="submitPassword()">
        Unlock
      </button>

      <button
        class="gray"
        onclick="closePassword()">
        Cancel
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   PDF.JS
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================
   VARIABLES
========================= */

let pdfFiles = [];
let pages = [];

let currentTool = null;

let waitingFile = null;


/* =========================
   FILE INPUT
========================= */

document
.getElementById("pdfInput")
.addEventListener("change", async function(e) {

  const files = [...e.target.files];

  if (!files.length)
    return;

  for (const file of files) {

    await openPDF(file);

  }

});


/* =========================
   OPEN PDF
========================= */

async function openPDF(file, password = null) {

  try {

    setStatus("Opening " + file.name + "...");

    const buffer =
      await file.arrayBuffer();

    const loadingTask =
      pdfjsLib.getDocument({
        data: buffer,
        password: password || undefined
      });

    loadingTask.onPassword =
      function(callback, reason) {

        waitingFile = {
          file,
          buffer,
          callback
        };

        document
          .getElementById("passwordBox")
          .style.display = "flex";

        document
          .getElementById("passwordInput")
          .focus();

      };

    const pdf =
      await loadingTask.promise;

    pdfFiles.push({
      file,
      buffer,
      pdf
    });

    await renderDocument(pdf);

    setStatus(
      pdfFiles.length +
      " PDF file(s) loaded"
    );

  }

  catch(error) {

    console.error(error);

    setStatus(
      "Could not open this PDF."
    );

    alert(
      "The PDF could not be opened. Check the password or file."
    );

  }

}


/* =========================
   PASSWORD
========================= */

function submitPassword() {

  const password =
    document
      .getElementById("passwordInput")
      .value;

  if (!waitingFile)
    return;

  try {

    waitingFile.callback(password);

    document
      .getElementById("passwordBox")
      .style.display = "none";

    document
      .getElementById("passwordInput")
      .value = "";

    waitingFile = null;

  }

  catch(error) {

    alert("Wrong password.");

  }

}


function closePassword() {

  document
    .getElementById("passwordBox")
    .style.display = "none";

  waitingFile = null;

}


/* =========================
   RENDER DOCUMENT
========================= */

async function renderDocument(pdf) {

  const container =
    document.getElementById("pages");

  const empty =
    container.querySelector(".empty");

  if (empty)
    empty.remove();

  for (
    let pageNumber = 1;
    pageNumber <= pdf.numPages;
    pageNumber++
  ) {

    const pdfPage =
      await pdf.getPage(pageNumber);

    const scale =
      window.innerWidth < 600
        ? 1.1
        : 1.4;

    const viewport =
      pdfPage.getViewport({
        scale
      });

    const wrapper =
      document.createElement("div");

    wrapper.className = "page";

    const pdfCanvas =
      document.createElement("canvas");

    pdfCanvas.className =
      "pdfCanvas";

    pdfCanvas.width =
      viewport.width;

    pdfCanvas.height =
      viewport.height;

    const context =
      pdfCanvas.getContext("2d");

    await pdfPage.render({
      canvasContext: context,
      viewport
    }).promise;


    const editCanvas =
      document.createElement("canvas");

    editCanvas.className =
      "editCanvas";

    editCanvas.width =
      viewport.width;

    editCanvas.height =
      viewport.height;


    wrapper.appendChild(pdfCanvas);
    wrapper.appendChild(editCanvas);

    container.appendChild(wrapper);

    setupDrawing(editCanvas);

    pages.push({
      pdfCanvas,
      editCanvas,
      wrapper
    });

  }

}


/* =========================
   DRAW / HIGHLIGHT
========================= */

function setTool(tool) {

  currentTool = tool;

  if (tool === "draw")
    setStatus("Drawing mode enabled");

  if (tool === "highlight")
    setStatus("Highlight mode enabled");

}


function setupDrawing(canvas) {

  const ctx =
    canvas.getContext("2d");

  let drawing = false;

  function position(e) {

    const rect =
      canvas.getBoundingClientRect();

    const source =
      e.touches
        ? e.touches[0]
        : e;

    return {
      x:
        (source.clientX - rect.left)
        * (canvas.width / rect.width),

      y:
        (source.clientY - rect.top)
        * (canvas.height / rect.height)
    };

  }


  function start(e) {

    if (!currentTool)
      return;

    e.preventDefault();

    drawing = true;

    const p = position(e);

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y
    );

  }


  function move(e) {

    if (!drawing)
      return;

    e.preventDefault();

    const p = position(e);

    if (currentTool === "draw") {

      ctx.strokeStyle =
        "#111827";

      ctx.lineWidth = 3;

      ctx.globalAlpha = 1;

    }

    if (currentTool === "highlight") {

      ctx.strokeStyle =
        "#ffff00";

      ctx.lineWidth = 22;

      ctx.globalAlpha = 0.35;

    }

    ctx.lineCap = "round";

    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

  }


  function stop() {

    drawing = false;

    ctx.closePath();

  }


  canvas.addEventListener(
    "mousedown",
    start
  );

  canvas.addEventListener(
    "mousemove",
    move
  );

  canvas.addEventListener(
    "mouseup",
    stop
  );

  canvas.addEventListener(
    "mouseleave",
    stop
  );

  canvas.addEventListener(
    "touchstart",
    start,
    {passive:false}
  );

  canvas.addEventListener(
    "touchmove",
    move,
    {passive:false}
  );

  canvas.addEventListener(
    "touchend",
    stop
  );

}


/* =========================
   CLEAR
========================= */

function clearEdits() {

  pages.forEach(p => {

    const ctx =
      p.editCanvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      p.editCanvas.width,
      p.editCanvas.height
    );

  });

}


/* =========================
   DELETE LAST PAGE
========================= */

function deleteLastPage() {

  if (!pages.length)
    return;

  const last =
    pages.pop();

  last.wrapper.remove();

  setStatus(
    pages.length +
    " page(s) remaining"
  );

}


/* =========================
   EXPORT
========================= */

async function exportPDF() {

  if (!pages.length) {

    alert("Open a PDF first.");

    return;

  }

  setStatus("Creating PDF...");

  const {
    PDFDocument
  } = PDFLib;

  const output =
    await PDFDocument.create();


  for (const page of pages) {

    const width =
      page.pdfCanvas.width;

    const height =
      page.pdfCanvas.height;


    const combined =
      document.createElement("canvas");

    combined.width = width;
    combined.height = height;

    const ctx =
      combined.getContext("2d");

    ctx.drawImage(
      page.pdfCanvas,
      0,
      0
    );

    ctx.drawImage(
      page.editCanvas,
      0,
      0
    );


    const image =
      await output.embedJpg(
        combined.toDataURL(
          "image/jpeg",
          0.95
        )
      );


    const newPage =
      output.addPage([
        width,
        height
      ]);


    newPage.drawImage(
      image,
      {
        x: 0,
        y: 0,
        width,
        height
      }
    );

  }


  const bytes =
    await output.save();


  const blob =
    new Blob(
      [bytes],
      {
        type:
          "application/pdf"
      }
    );


  window.lastPDFBlob = blob;


  downloadBlob(
    blob,
    "edited-pdf.pdf"
  );


  setStatus(
    "PDF saved successfully"
  );

}


/* =========================
   DOWNLOAD
========================= */

function downloadBlob(blob, filename) {

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );

}


/* =========================
   ANDROID + IPHONE SHARE
========================= */

async function sharePDF() {

  if (!window.lastPDFBlob) {

    await exportPDF();

  }

  if (!window.lastPDFBlob)
    return;


  const file =
    new File(
      [window.lastPDFBlob],
      "edited-pdf.pdf",
      {
        type:
          "application/pdf"
      }
    );


  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({
      files: [file]
    })
  ) {

    try {

      await navigator.share({

        title:
          "Edited PDF",

        text:
          "Sharing edited PDF",

        files: [file]

      });

      setStatus(
        "Share sheet opened"
      );

    }

    catch(error) {

      console.log(
        "Share cancelled",
        error
      );

    }

  }

  else {

    alert(
      "Direct file sharing is not supported in this browser. The PDF has been downloaded. Open it from Files/Downloads and use Android or iPhone Share → WhatsApp."
    );

  }

}


/* =========================
   STATUS
========================= */

function setStatus(message) {

  document
    .getElementById("status")
    .textContent = message;

}

</script>

</body>
</html>
