<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Photo Text Remover</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 16px;
    background: #030712;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.toolbar {
    background: #1f2937;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

button,
.upload {
    border: 0;
    padding: 10px 13px;
    border-radius: 8px;
    color: white;
    background: #2563eb;
    cursor: pointer;
    font-weight: 600;
}

button:hover,
.upload:hover {
    opacity: .85;
}

.upload input {
    display: none;
}

.red {
    background: #dc2626;
}

.green {
    background: #16a34a;
}

.gray {
    background: #4b5563;
}

.orange {
    background: #ea580c;
}

#workspace {
    padding: 20px 10px 80px;
    display: flex;
    justify-content: center;
}

#canvasBox {
    position: relative;
    display: none;
}

#photoCanvas {
    display: block;
    max-width: 100%;
    height: auto;
    background: white;
    box-shadow: 0 5px 30px #0008;
    touch-action: none;
}

#brushCursor {
    position: fixed;
    width: 30px;
    height: 30px;
    border: 2px solid white;
    border-radius: 50%;
    pointer-events: none;
    display: none;
    z-index: 100;
}

.controls {
    background: #1f2937;
    padding: 12px;
    text-align: center;
}

.controls label {
    margin: 5px;
}

input[type="range"] {
    width: 120px;
}

input[type="color"] {
    width: 45px;
    height: 35px;
    border: 0;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 100px 20px;
}

#status {
    text-align: center;
    color: #d1d5db;
    padding: 8px;
}

.textInput {
    position: fixed;
    display: none;
    z-index: 200;
    padding: 10px;
    background: white;
    color: black;
    border-radius: 8px;
    border: 2px solid #2563eb;
}

</style>
</head>

<body>

<header>
    <h1>📸 Photo Text Remover</h1>
</header>

<div class="toolbar">

    <label class="upload">
        🖼️ Open Photo
        <input
            type="file"
            id="imageInput"
            accept="image/*">
    </label>

    <button onclick="setTool('erase')">
        🧹 Remove
    </button>

    <button onclick="setTool('cover')">
        🎨 Cover
    </button>

    <button onclick="setTool('text')">
        ✍️ Add Text
    </button>

    <button class="gray"
            onclick="undo()">
        ↩️ Undo
    </button>

    <button class="gray"
            onclick="resetImage()">
        🔄 Reset
    </button>

    <button class="green"
            onclick="downloadImage()">
        📥 Download
    </button>

    <button class="orange"
            onclick="shareImage()">
        📤 Share
    </button>

</div>

<div class="controls">

    <label>
        Brush:
        <input
            id="brushSize"
            type="range"
            min="5"
            max="150"
            value="35">
    </label>

    <label>
        Color:
        <input
            id="brushColor"
            type="color"
            value="#ffffff">
    </label>

</div>

<div id="status">
    Upload a photo to start.
</div>

<div id="workspace">

    <div id="canvasBox">

        <canvas id="photoCanvas"></canvas>

    </div>

    <div class="empty"
         id="emptyMessage">

        🖼️ Upload a photo to begin.

    </div>

</div>

<div id="brushCursor"></div>

<script>

const canvas =
    document.getElementById("photoCanvas");

const ctx =
    canvas.getContext("2d");

const imageInput =
    document.getElementById("imageInput");

const canvasBox =
    document.getElementById("canvasBox");

const emptyMessage =
    document.getElementById("emptyMessage");

const statusText =
    document.getElementById("status");

const brushSize =
    document.getElementById("brushSize");

const brushColor =
    document.getElementById("brushColor");

let image = null;

let originalImage = null;

let tool = "erase";

let drawing = false;

let history = [];

let lastBlob = null;


/* =========================
   OPEN IMAGE
========================= */

imageInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                const img =
                    new Image();

                img.onload =
                    function() {

                        image = img;

                        originalImage =
                            img;

                        canvas.width =
                            img.naturalWidth;

                        canvas.height =
                            img.naturalHeight;

                        ctx.drawImage(
                            img,
                            0,
                            0
                        );

                        history = [];

                        saveHistory();

                        canvasBox.style.display =
                            "block";

                        emptyMessage.style.display =
                            "none";

                        setStatus(
                            "Photo loaded."
                        );

                    };

                img.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* =========================
   TOOLS
========================= */

function setTool(selectedTool) {

    tool =
        selectedTool;

    if (tool === "erase") {

        setStatus(
            "Paint over the text you want to remove."
        );

    }

    if (tool === "cover") {

        setStatus(
            "Choose a color and paint over the text."
        );

    }

    if (tool === "text") {

        setStatus(
            "Tap the photo where you want to add text."
        );

    }

}


/* =========================
   CANVAS POSITION
========================= */

function getCanvasPosition(event) {

    const rect =
        canvas.getBoundingClientRect();

    let clientX;
    let clientY;

    if (event.touches) {

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    } else {

        clientX =
            event.clientX;

        clientY =
            event.clientY;

    }

    return {

        x:
            (clientX - rect.left)
            *
            (canvas.width / rect.width),

        y:
            (clientY - rect.top)
            *
            (canvas.height / rect.height)

    };

}


/* =========================
   DRAW START
========================= */

function startDrawing(event) {

    if (!image) return;

    if (tool === "text") {

        event.preventDefault();

        addText(event);

        return;

    }

    event.preventDefault();

    drawing = true;

    saveHistory();

    draw(event);

}


/* =========================
   DRAW
========================= */

function draw(event) {

    if (!drawing) return;

    event.preventDefault();

    const p =
        getCanvasPosition(event);

    const size =
        Number(
            brushSize.value
        );


    if (tool === "erase") {

        /*
         * Simple background reconstruction:
         * use nearby sampled color.
         */

        const sampleSize =
            Math.max(
                2,
                Math.floor(size / 4)
            );

        let sx =
            Math.max(
                0,
                Math.min(
                    canvas.width - 1,
                    Math.floor(p.x)
                )
            );

        let sy =
            Math.max(
                0,
                Math.min(
                    canvas.height - 1,
                    Math.floor(p.y)
                )
            );

        const pixel =
            ctx.getImageData(
                sx,
                sy,
                1,
                1
            ).data;

        ctx.fillStyle =
            `rgb(
                ${pixel[0]},
                ${pixel[1]},
                ${pixel[2]}
            )`;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    if (tool === "cover") {

        ctx.fillStyle =
            brushColor.value;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size / 2,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================
   STOP
========================= */

function stopDrawing() {

    if (!drawing) return;

    drawing = false;

}


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
    "mousedown",
    startDrawing
);

canvas.addEventListener(
    "mousemove",
    draw
);

canvas.addEventListener(
    "mouseup",
    stopDrawing
);

canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


/* =========================
   TOUCH
========================= */

canvas.addEventListener(
    "touchstart",
    startDrawing,
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchmove",
    draw,
    {
        passive: false
    }
);

canvas.addEventListener(
    "touchend",
    stopDrawing
);


/* =========================
   TEXT
========================= */

function addText(event) {

    const text =
        prompt(
            "Enter text:"
        );

    if (!text) return;

    const p =
        getCanvasPosition(event);

    saveHistory();

    ctx.fillStyle =
        "#111111";

    ctx.font =
        `${Math.max(
            20,
            Number(brushSize.value)
        )}px Arial`;

    ctx.fillText(
        text,
        p.x,
        p.y
    );

    setStatus(
        "Text added."
    );

}


/* =========================
   HISTORY
========================= */

function saveHistory() {

    if (!canvas.width)
        return;

    history.push(
        canvas.toDataURL(
            "image/png"
        )
    );

    if (history.length > 20) {

        history.shift();

    }

}


/* =========================
   UNDO
========================= */

function undo() {

    if (history.length <= 1) {

        setStatus(
            "Nothing to undo."
        );

        return;

    }

    history.pop();

    const previous =
        history[
            history.length - 1
        ];

    const img =
        new Image();

    img.onload =
        function() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.drawImage(
                img,
                0,
                0
            );

        };

    img.src =
        previous;

}


/* =========================
   RESET
========================= */

function resetImage() {

    if (!originalImage)
        return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        originalImage,
        0,
        0
    );

    history = [];

    saveHistory();

    setStatus(
        "Photo reset."
    );

}


/* =========================
   DOWNLOAD
========================= */

function downloadImage() {

    if (!image) {

        alert(
            "Upload a photo first."
        );

        return;

    }

    canvas.toBlob(
        function(blob) {

            lastBlob =
                blob;

            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                url;

            link.download =
                "edited-photo.png";

            document.body.appendChild(
                link
            );

            link.click();

            link.remove();

            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );

            setStatus(
                "Photo downloaded."
            );

        },
        "image/png"
    );

}


/* =========================
   SHARE
========================= */

async function shareImage() {

    if (!image) {

        alert(
            "Upload a photo first."
        );

        return;

    }


    canvas.toBlob(
        async function(blob) {

            lastBlob =
                blob;

            const file =
                new File(
                    [
                        blob
                    ],
                    "edited-photo.png",
                    {
                        type:
                            "image/png"
                    }
                );


            /*
             * Android + iPhone
             */

            if (
                navigator.share &&
                navigator.canShare &&
                navigator.canShare({
                    files: [file]
                })
            ) {

                try {

                    await navigator.share({

                        title:
                            "Edited Photo",

                        text:
                            "Edited photo",

                        files:
                            [file]

                    });

                    setStatus(
                        "Share menu opened."
                    );

                }

                catch(error) {

                    console.log(
                        "Share cancelled."
                    );

                }

            }

            else {

                /*
                 * Fallback
                 */

                downloadImage();

                alert(
                    "Direct sharing isn't supported by this browser. The edited photo was downloaded. Open it and choose WhatsApp."
                );

            }

        },
        "image/png"
    );

}


/* =========================
   STATUS
========================= */

function setStatus(message) {

    statusText.textContent =
        message;

}

</script>

</body>
</html>
