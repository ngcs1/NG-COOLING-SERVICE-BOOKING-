<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PDF Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef1f5;
  font-family: Arial, sans-serif;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 16px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: white;
  padding: 10px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: center;
  box-shadow: 0 2px 10px #0002;
}

button,
.upload {
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  color: white;
  background: #2563eb;
  cursor: pointer;
  font-weight: 600;
}

.upload input {
  display: none;
}

.green {
  background: #16a34a;
}

.red {
  background: #dc2626;
}

.gray {
  background: #4b5563;
}

#status {
  text-align: center;
  padding: 10px;
  font-size: 14px;
}

#pages {
  padding: 20px 10px;
}

.page {
  position: relative;
  width: fit-content;
  margin: 0 auto 25px;
  background: white;
  box-shadow: 0 4px 18px #0002;
}

.pdfCanvas {
  display: block;
  max-width: 100%;
}

.drawCanvas {
  position: absolute;
  left: 0;
  top: 0;
}

.textBox {
  position: absolute;
  min-width: 80px;
  min-height: 25px;
  padding: 3px;
  border: 1px dashed #2563eb;
  background: rgba(255,255,255,.75);
  color: #111;
  outline: none;
  font-size: 18px;
  font-family: Arial;
  resize: both;
}

.textBox:focus {
  border: 2px solid #2563eb;
}

.pageTools {
  position: absolute;
  top: 5px;
  right: 5px;
  z-index: 5;
}

.deleteText {
  background: #dc2626;
  color: white;
  border: 0;
  border-radius: 5px;
  padding: 4px 7px;
  cursor: pointer;
}

.empty {
  text-align: center;
  padding: 80px 20px;
  color: #6b7280;
}

@media(max-width:600px) {
  button,
  .upload {
    font-size: 12px;
    padding: 8px 10px;
  }

  #pages {
    padding: 10px 3px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📄 PDF Editor</h1>
</header>

<div class="toolbar">

  <label class="upload">
    📂 Open PDF
    <input
      id="pdfInput"
      type="file"
      accept="application/pdf"
      multiple>
  </label>

  <button onclick="enableText()">
    ⌨️ Add / Correct Text
  </button>

  <button onclick="enableDraw()">
    ✏️ Draw
  </button>

  <button onclick="enableHighlight()">
    🟡 Highlight
  </button>

  <button class="gray" onclick="clearEdits()">
    🧹 Clear
  </button>

  <button class="red" onclick="deleteLastPage()">
    🗑 Delete Page
  </button>

  <button class="green" onclick="savePDF()">
    💾 Save PDF
  </button>

  <button onclick="sharePDF()">
    📤 Share
  </button>

</div>

<div id="status">
  Upload a PDF to start.
</div>

<div id="pages">
  <div class="empty">
    📄 Choose a PDF file
  </div>
</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let documents = [];
let pages = [];

let currentTool = null;
let lastPDFBlob = null;


/* =========================
   OPEN PDF
========================= */

document
.getElementById("pdfInput")
.addEventListener("change", async function(event) {

  const files = [...event.target.files];

  if (!files.length) return;

  for (const file of files) {

    await loadPDF(file);

  }

});


async function loadPDF(file) {

  try {

    setStatus("Opening " + file.name + "...");

    const buffer =
      await file.arrayBuffer();

    /*
      No password popup.
      Normal PDFs open directly.
    */

    const pdf =
      await pdfjsLib.getDocument({
        data: buffer
      }).promise;

    documents.push({
      file,
      pdf
    });

    await renderPDF(pdf);

    setStatus(
      "PDF loaded successfully"
    );

  }

  catch(error) {

    console.error(error);

    alert(
      "This PDF cannot be opened without its required password."
    );

  }

}


/* =========================
   RENDER
========================= */

async function renderPDF(pdf) {

  const container =
    document.getElementById("pages");

  const empty =
    container.querySelector(".empty");

  if (empty)
    empty.remove();


  for (
    let pageNumber = 1;
    pageNumber <= pdf.numPages;
    pageNumber++
  ) {

    const pdfPage =
      await pdf.getPage(pageNumber);

    const scale =
      window.innerWidth < 600
        ? 1.1
        : 1.5;

    const viewport =
      pdfPage.getViewport({
        scale
      });


    const wrapper =
      document.createElement("div");

    wrapper.className = "page";


    const pdfCanvas =
      document.createElement("canvas");

    pdfCanvas.className =
      "pdfCanvas";

    pdfCanvas.width =
      viewport.width;

    pdfCanvas.height =
      viewport.height;


    const ctx =
      pdfCanvas.getContext("2d");


    await pdfPage.render({
      canvasContext: ctx,
      viewport
    }).promise;


    const drawCanvas =
      document.createElement("canvas");

    drawCanvas.className =
      "drawCanvas";

    drawCanvas.width =
      viewport.width;

    drawCanvas.height =
      viewport.height;


    wrapper.appendChild(pdfCanvas);

    wrapper.appendChild(drawCanvas);

    container.appendChild(wrapper);


    setupDrawing(drawCanvas);


    pages.push({
      wrapper,
      pdfCanvas,
      drawCanvas
    });

  }

}


/* =========================
   TEXT MODE
========================= */

function enableText() {

  currentTool = "text";

  setStatus(
    "Tap/click anywhere on a page to add text."
  );

  pages.forEach(page => {

    page.wrapper.onclick =
      function(event) {

        if (
          event.target.classList.contains(
            "textBox"
          )
        )
          return;

        addTextBox(
          page.wrapper,
          event
        );

      };

  });

}


function addTextBox(wrapper, event) {

  const rect =
    wrapper.getBoundingClientRect();

  const box =
    document.createElement("div");

  box.className = "textBox";

  box.contentEditable = "true";

  box.textContent =
    "Type here";

  box.style.left =
    (event.clientX - rect.left) + "px";

  box.style.top =
    (event.clientY - rect.top) + "px";


  wrapper.appendChild(box);


  box.focus();


  box.addEventListener(
    "click",
    function(e) {

      e.stopPropagation();

    }
  );


  const deleteButton =
    document.createElement("button");

  deleteButton.className =
    "deleteText";

  deleteButton.textContent =
    "×";

  deleteButton.style.position =
    "absolute";

  deleteButton.style.right =
    "-25px";

  deleteButton.style.top =
    "0";


  box.appendChild(deleteButton);


  deleteButton.onclick =
    function(e) {

      e.stopPropagation();

      box.remove();

    };

}


/* =========================
   DRAWING
========================= */

function enableDraw() {

  currentTool = "draw";

  removeTextClickHandlers();

  setStatus(
    "Drawing mode enabled."
  );

}


function enableHighlight() {

  currentTool = "highlight";

  removeTextClickHandlers();

  setStatus(
    "Highlight mode enabled."
  );

}


function removeTextClickHandlers() {

  pages.forEach(page => {

    page.wrapper.onclick = null;

  });

}


function setupDrawing(canvas) {

  const ctx =
    canvas.getContext("2d");

  let drawing = false;


  function getPosition(event) {

    const rect =
      canvas.getBoundingClientRect();

    const source =
      event.touches
        ? event.touches[0]
        : event;

    return {

      x:
        (source.clientX - rect.left)
        * (canvas.width / rect.width),

      y:
        (source.clientY - rect.top)
        * (canvas.height / rect.height)

    };

  }


  function start(event) {

    if (
      currentTool !== "draw" &&
      currentTool !== "highlight"
    )
      return;

    event.preventDefault();

    drawing = true;

    const p =
      getPosition(event);

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y
    );

  }


  function move(event) {

    if (!drawing)
      return;

    event.preventDefault();

    const p =
      getPosition(event);


    if (currentTool === "draw") {

      ctx.strokeStyle =
        "#111827";

      ctx.lineWidth =
        3;

      ctx.globalAlpha =
        1;

    }


    if (currentTool === "highlight") {

      ctx.strokeStyle =
        "#ffff00";

      ctx.lineWidth =
        22;

      ctx.globalAlpha =
        .35;

    }


    ctx.lineCap =
      "round";


    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

  }


  function stop() {

    drawing = false;

    ctx.closePath();

  }


  canvas.addEventListener(
    "mousedown",
    start
  );

  canvas.addEventListener(
    "mousemove",
    move
  );

  canvas.addEventListener(
    "mouseup",
    stop
  );

  canvas.addEventListener(
    "mouseleave",
    stop
  );


  canvas.addEventListener(
    "touchstart",
    start,
    { passive:false }
  );

  canvas.addEventListener(
    "touchmove",
    move,
    { passive:false }
  );

  canvas.addEventListener(
    "touchend",
    stop
  );

}


/* =========================
   CLEAR
========================= */

function clearEdits() {

  pages.forEach(page => {

    const ctx =
      page.drawCanvas
        .getContext("2d");

    ctx.clearRect(
      0,
      0,
      page.drawCanvas.width,
      page.drawCanvas.height
    );


    page.wrapper
      .querySelectorAll(
        ".textBox"
      )
      .forEach(box => box.remove());

  });

}


/* =========================
   DELETE LAST PAGE
========================= */

function deleteLastPage() {

  if (!pages.length)
    return;

  const page =
    pages.pop();

  page.wrapper.remove();

  setStatus(
    pages.length +
    " page(s) remaining"
  );

}


/* =========================
   SAVE PDF
========================= */

async function savePDF() {

  if (!pages.length) {

    alert(
      "Please open a PDF first."
    );

    return;

  }


  setStatus(
    "Creating edited PDF..."
  );


  const {
    jsPDF
  } = window.jspdf;


  const first =
    pages[0].pdfCanvas;


  const pdf =
    new jsPDF({

      orientation:
        first.width >
        first.height
          ? "landscape"
          : "portrait",

      unit: "px",

      format: [
        first.width,
        first.height
      ]

    });


  pages.forEach(
    (page, index) => {

      if (index > 0) {

        pdf.addPage([
          page.pdfCanvas.width,
          page.pdfCanvas.height
        ]);

      }


      const combined =
        document.createElement(
          "canvas"
        );


      combined.width =
        page.pdfCanvas.width;

      combined.height =
        page.pdfCanvas.height;


      const ctx =
        combined.getContext("2d");


      /*
        Original PDF
      */

      ctx.drawImage(
        page.pdfCanvas,
        0,
        0
      );


      /*
        Draw / highlight
      */

      ctx.drawImage(
        page.drawCanvas,
        0,
        0
      );


      /*
        Text corrections
      */

      const textBoxes =
        page.wrapper
          .querySelectorAll(
            ".textBox"
          );


      textBoxes.forEach(box => {

        const boxRect =
          box.getBoundingClientRect();

        const pageRect =
          page.wrapper.getBoundingClientRect();


        const x =
          boxRect.left -
          pageRect.left;

        const y =
          boxRect.top -
          pageRect.top;


        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(
          x,
          y,
          boxRect.width,
          boxRect.height
        );


        ctx.fillStyle =
          "#111111";


        ctx.font =
          "18px Arial";


        ctx.fillText(
          box.innerText
            .replace("×", "")
            .trim(),

          x + 4,
          y + 20
        );

      });


      pdf.addImage(

        combined.toDataURL(
          "image/jpeg",
          .95
        ),

        "JPEG",

        0,
        0,

        page.pdfCanvas.width,
        page.pdfCanvas.height

      );

    }
  );


  const blob =
    pdf.output(
      "blob"
    );


  lastPDFBlob =
    blob;


  downloadBlob(
    blob,
    "edited-pdf.pdf"
  );


  setStatus(
    "Edited PDF saved."
  );

}


/* =========================
   DOWNLOAD
========================= */

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href =
    url;

  link.download =
    filename;

  document.body.appendChild(
    link
  );

  link.click();

  link.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}


/* =========================
   SHARE
========================= */

async function sharePDF() {

  if (!lastPDFBlob) {

    await savePDF();

  }


  if (!lastPDFBlob)
    return;


  const file =
    new File(
      [lastPDFBlob],
      "edited-pdf.pdf",
      {
        type:
          "application/pdf"
      }
    );


  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({
      files: [file]
    })
  ) {

    try {

      await navigator.share({

        title:
          "Edited PDF",

        text:
          "Edited PDF",

        files: [file]

      });

      setStatus(
        "Share menu opened."
      );

    }

    catch(error) {

      console.log(
        "Share cancelled"
      );

    }

  }

  else {

    alert(
      "Your browser does not support direct file sharing. The PDF was downloaded. Open it from Downloads/Files and choose WhatsApp."
    );

  }

}


/* =========================
   STATUS
========================= */

function setStatus(text) {

  document
    .getElementById("status")
    .textContent =
      text;

}

</script>

</body>
</html>
